[project]
name = "buffett-earnings-toolkit"
version = "0.1.0"
description = "Buffett-style company analysis and earnings-calendar monitoring tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.0.25",
    "httpx>=0.27.0",
    "pandas>=2.1.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
